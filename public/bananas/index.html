<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap');

:root{
  --paper:#FBF0C9; --paper-2:#F4E2A4; --paper-3:#EFD88C;
  --peel:#EFBB1C; --peel-soft:#F7D566;
  --tan:#C89A62; --tan-2:#AC7C43;
  --cocoa:#462E14; --cocoa-2:#6B4A24; --cocoa-mute:rgba(70,46,20,.58);
  --line:rgba(70,46,20,.14); --line-strong:rgba(70,46,20,.3);
}
*{box-sizing:border-box;}
html{background:var(--paper);}
body{
  margin:0;
  font-family:'Bricolage Grotesque','Helvetica Neue',system-ui,-apple-system,sans-serif;
  background:var(--paper); color:var(--cocoa);
  min-height:100vh; min-height:100dvh;
  font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cocoa);outline-offset:2px;}
h1,h2,h3{margin:0;}
.wrap{max-width:520px;margin:0 auto;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom));}

/* one-line status on the log tab */
.ticker{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--cocoa-2);margin-bottom:14px;}
.ticker b{font-size:16px;font-weight:800;color:var(--cocoa);}
.ticker-sep{width:4px;height:4px;border-radius:50%;background:var(--tan);}
.sync{margin-left:auto;font-size:12px;color:var(--cocoa-mute);}

/* day selector */
.daybar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:8px 10px;border-radius:14px;
  border:1px solid var(--line);transition:border-color .15s ease,background .15s ease;}
.daybar-back{border-color:var(--cocoa);background:var(--paper-2);}
.daybar-label{font-size:12.5px;color:var(--cocoa-mute);white-space:nowrap;}
.daybar-opts{display:flex;gap:6px;flex:1;justify-content:flex-end;}
.day-b{padding:7px 11px;font-size:13px;border-radius:9px;border:1px solid var(--line-strong);color:var(--cocoa-2);}
.day-b.day-on,.day-date.day-on{background:var(--cocoa);color:var(--paper);border-color:var(--cocoa);font-weight:700;}
.day-date{background:none;border:1px solid var(--line-strong);border-radius:9px;color:var(--cocoa-2);
  font-family:inherit;font-size:13px;padding:6px 8px;max-width:134px;}
.dayhint{margin:-6px 0 14px;font-size:12px;color:var(--cocoa-mute);padding:0 2px;}

/* the fast path */
.pad{margin-bottom:14px;}
.pad-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.pad-label{font-size:13px;color:var(--cocoa-2);}
.pad-link{font-size:13px;color:var(--cocoa-2);text-decoration:underline;
  text-underline-offset:3px;text-decoration-color:var(--tan);padding:4px 0;}
.pad-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;}
.key{background:var(--cocoa);color:var(--paper);font-size:22px;font-weight:700;border-radius:13px;
  padding:13px 0;transition:transform .08s ease,background .12s ease,color .12s ease;}
.key:active{transform:scale(.92);background:var(--peel);color:var(--cocoa);}

/* log tab chart */
.lc{margin:0 0 14px;}
.lc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
.lc-title{font-size:14px;font-weight:700;}
.lc-note{font-size:12px;color:var(--cocoa-mute);}
.grow{transform-box:fill-box;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.2,1.25,.4,1);}
.lift{transition:transform .45s cubic-bezier(.2,1.25,.4,1);}
@media (prefers-reduced-motion:reduce){.grow,.lift{transition:none}}
.pad-more{width:100%;margin-top:9px;padding:12px;border-radius:13px;border:1px solid var(--line-strong);
  font-size:14px;color:var(--cocoa-2);}
.pad-more:active{background:var(--paper-2);}

/* buy */
.buy{display:flex;align-items:center;gap:9px;padding:11px;border:1px solid var(--tan);
  background:var(--paper-2);border-radius:16px;margin-bottom:6px;}
.buy-label{font-size:14px;color:var(--cocoa-2);}
.buy-input{width:76px;background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;
  color:var(--cocoa);font-family:inherit;font-size:19px;font-weight:700;padding:9px 10px;text-align:center;}
.buy-go{flex:1;background:var(--tan-2);color:var(--paper);font-size:15px;font-weight:700;padding:13px;border-radius:12px;}
.buy-go:active{background:var(--cocoa);}

/* house tab */
.house-head{padding:8px 0 16px;}
.house-count{display:flex;align-items:baseline;gap:9px;animation:pop .35s cubic-bezier(.2,1.3,.4,1);}
.house-count strong{font-size:clamp(42px,12vw,58px);font-weight:800;line-height:.9;letter-spacing:-.03em;}
.house-count span{font-size:14px;color:var(--cocoa-2);}
@keyframes pop{from{transform:scale(.9);opacity:.5}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.house-count{animation:none}}
.house-eta{margin:10px 0 0;font-size:13.5px;color:var(--cocoa-2);max-width:40ch;line-height:1.5;}
.bunch{display:flex;flex-wrap:wrap;gap:6px 13px;align-items:center;padding:4px 0 18px;}
.bunch-group{display:flex;}
.bunch-group .glyph{margin-right:-6px;}
.bunch-more{font-size:13px;color:var(--cocoa-mute);}

/* stats */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line);}
.strip-plain{border-bottom:1px solid var(--line);}
.stat-value{font-size:23px;font-weight:800;line-height:1.1;}
.stat-label{font-size:11.5px;color:var(--cocoa-2);margin-top:3px;}
.stat-sub{font-size:11px;color:var(--tan-2);}

/* sections */
.sec{padding:20px 0;border-bottom:1px solid var(--line);}
.sec:last-child{border-bottom:none;}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;}
.sec-head h2{font-size:17px;font-weight:700;letter-spacing:-.01em;}
.sec-note{font-size:12px;color:var(--cocoa-mute);text-align:right;}
.foot{margin:10px 0 0;font-size:13px;line-height:1.5;color:var(--cocoa-2);max-width:46ch;}

/* segmented control */
.seg{display:flex;gap:6px;margin-bottom:12px;}
.seg-b{flex:1;padding:8px 0;font-size:13px;border-radius:10px;border:1px solid var(--line-strong);color:var(--cocoa-2);}
.seg-on{background:var(--cocoa);color:var(--paper);border-color:var(--cocoa);font-weight:700;}

/* charts */
.chart{width:100%;position:relative;}
.chart svg{display:block;width:100%;}
.tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  background:var(--paper);border:1px solid var(--cocoa);border-radius:10px;padding:7px 10px;
  font-size:12.5px;color:var(--cocoa-2);line-height:1.5;white-space:nowrap;z-index:5;
  box-shadow:0 4px 12px rgba(70,46,20,.18);transition:opacity .12s ease;}
.tip.on{opacity:1;}
.tip .d{font-weight:700;color:var(--cocoa);}
.tip b{font-weight:800;color:var(--cocoa);}

/* feed */
.feed{list-style:none;margin:0;padding:0;}
.feed li{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.feed li:last-child{border-bottom:none;}
.chip{font-size:11px;padding:3px 7px;border-radius:6px;font-weight:700;}
.chip-eat{background:var(--peel-soft);color:var(--cocoa);}
.chip-buy{background:var(--tan);color:#fff;}
.chip-open{background:var(--cocoa);color:var(--paper);}
.chip-count{background:var(--paper);color:var(--cocoa-2);border:1px solid var(--line-strong);padding:2px 6px;}
.fix-link{display:block;margin:4px 0 0 auto;font-size:12.5px;color:var(--cocoa-mute);}
.chip-away{background:var(--paper);color:var(--cocoa);border:1px dashed var(--tan-2);padding:2px 6px;}

/* "not from the house" checkbox */
.check{display:flex;align-items:flex-start;gap:11px;margin:0 0 16px;padding:12px;border-radius:12px;
  border:1px solid var(--line-strong);cursor:pointer;position:relative;}
.check input{position:absolute;opacity:0;width:1px;height:1px;}
.check-box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--cocoa-2);
  background:var(--paper);margin-top:1px;position:relative;transition:background .12s ease;}

<body>
<div id="app"></div>

<script>
"use strict";

/* ================================================================ */
/* storage                                                          */
/* ================================================================ */

var KEY = "banana-data-v1";

/* The history reconstructed from Connor's records. Eating starts 9/09.
   Purchases weren't tracked until 9/12, so the house count opens there. */
var BACKLOG = [
  { d: "2026-09-09", t: "eat", n: 15 },
  { d: "2026-09-10", t: "eat", n: 12 },
  { d: "2026-09-11", t: "eat", n: 10 },
  { d: "2026-09-12", t: "open", n: 37 },
  { d: "2026-09-12", t: "eat", n: 16 },
  { d: "2026-09-12", t: "buy", n: 33 },
  { d: "2026-09-12", t: "eat", n: 3 },
  { d: "2026-09-13", t: "buy", n: 8 },
  { d: "2026-09-13", t: "eat", n: 13 },
  { d: "2026-09-14", t: "buy", n: 30 },
  { d: "2026-09-14", t: "eat", n: 6 },
  { d: "2026-09-14", t: "eat", n: 4 },
  { d: "2026-09-14", t: "buy", n: 5 }
];

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return null;
    var d = JSON.parse(raw);
    if (!d || !Array.isArray(d.events)) return null;
    return d.events;
  } catch (e) { return null; }
}

/* fromServer = this copy just came from the site, so there's nothing new to send back. */
function save(fromServer) {
  try {
    localStorage.setItem(KEY, JSON.stringify({ version: 1, events: events }));
    if (!fromServer) localStorage.setItem(KEY + ":dirty", "1");
  } catch (e) { /* storage full or blocked; keep running in memory */ }
  if (!fromServer) schedulePush();
}

/* ================================================================ */
/* sync with connorvanscyoc.com                                     */
/* The site keeps the real log. This device keeps a copy so it works */
/* offline; anything logged here is sent up as soon as it can be.    */
/* Only a device holding the key can send. Everyone else views.      */
/* ================================================================ */

var API = "/api/bananas";
var KEY_STORE = "banana-key";

(function grabKeyFromLink() {
  var m = location.hash.match(/key=([^&]+)/);
  if (m) { try { localStorage.setItem(KEY_STORE, decodeURIComponent(m[1])); } catch (e) {} }
})();

function getKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }
var canEdit = !!getKey();
var syncState = "idle";   // idle | saving | saved | offline | error | denied
var pushTimer = null;

function isDirty() { try { return localStorage.getItem(KEY + ":dirty") === "1"; } catch (e) { return false; } }
function setClean() { try { localStorage.removeItem(KEY + ":dirty"); } catch (e) {} }

function schedulePush() {
  if (!canEdit) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 400);
}

function push() {
  if (!canEdit || !isDirty()) return;
  syncState = "saving"; showSync();
  fetch(API, {
    method: "PUT",
    headers: { "content-type": "application/json", "authorization": "Bearer " + getKey() },
    body: JSON.stringify({ events: events })
  }).then(function (r) {
    if (r.status === 401) { syncState = "denied"; return; }
    if (!r.ok) throw new Error("status " + r.status);
    setClean(); syncState = "saved";
  }).catch(function () {
    syncState = navigator.onLine === false ? "offline" : "error";
  }).then(showSync);
}

function pull() {
  fetch(API, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d || !Array.isArray(d.events)) return;
      if (canEdit && isDirty()) { push(); return; }   // this device has newer entries; send them
      events = d.events.map(function (e) {
        return { id: String(e.id), t: e.t, n: Number(e.n), ts: Number(e.ts) };
      }).sort(function (a, b) { return a.ts - b.ts; });
      save(true);
      render();
    }).catch(function () {});
}

function syncText() {
  if (!canEdit) return "";
  return syncState === "saving" ? "Saving\u2026"
    : syncState === "saved" ? "Saved"
    : syncState === "offline" ? "Offline, will save later"
    : syncState === "error" ? "Couldn\u2019t save, will retry"
    : syncState === "denied" ? "Key not working"
    : isDirty() ? "Not saved yet" : "";
}

function showSync() {
  var box = document.getElementById("sync");
  if (box) box.textContent = syncText();
}

window.addEventListener("online", push);
document.addEventListener("visibilitychange", function () {
  if (document.hidden) return;
  if (canEdit && isDirty()) push(); else pull();
});
setInterval(function () { if (canEdit && isDirty()) push(); }, 30000);

/* ================================================================ */
/* dates — everything is day-level. A banana day runs 4:30am-4:30am. */
/* ================================================================ */

var DAY_MS = 86400000;
var CUTOFF_MS = 4.5 * 3600 * 1000;
var WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var WD_LONG = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function pad2(n) { return String(n).padStart(2, "0"); }
function dayKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function fromDayKey(k) { var p = k.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function wdIndex(d) { return (d.getDay() + 6) % 7; }
function weekStart(d) { var x = midnight(d); x.setDate(x.getDate() - wdIndex(x)); return x; }
function shortDate(d) { return MO[d.getMonth()] + " " + d.getDate(); }
function niceDate(d) { return WD[wdIndex(d)] + ", " + MO[d.getMonth()] + " " + d.getDate(); }
function round(n, p) { p = p == null ? 1 : p; var f = Math.pow(10, p); return Math.round(n*f)/f; }
function logicalNow() { return new Date(Date.now() - CUTOFF_MS); }

/* Day-keyed rows to events, spaced by entry order inside each day. */
function expandDays(rows) {
  var seen = {};
  return rows.map(function (r, i) {
    var base = fromDayKey(r.d).getTime();
    var k = seen[r.d] || 0;
    seen[r.d] = k + 1;
    var ts = base + k * 1000;
    return { id: "bk-" + i + "-" + ts, t: r.t, n: Number(r.n), ts: ts };
  }).sort(function (a, b) { return a.ts - b.ts; });
}

/* ================================================================ */
/* state                                                            */
/* ================================================================ */

var events = load() || [];

var tab = "log";
var range = "day";
var dayRange = (function () { try { return localStorage.getItem("banana-dayrange") || "30"; } catch (e) { return "30"; } })();
/* Desktop gets its own layout and taller charts; phones keep the original. */
function wide() { return window.matchMedia("(min-width: 900px)").matches; }
var showMA = (function () { try { return localStorage.getItem("banana-ma") === "1"; } catch (e) { return false; } })();
var logDate = null;      // null = the current banana day
var sheet = null;        // "custom" | "data"
var undoEv = null;
var undoTimer = null;
var buyDraft = "";
var importErr = "";

function customType() {
  var box = document.getElementById("customaway");
  return box && box.checked ? "away" : "eat";
}

function addEntry(type, n) {
  if (!canEdit) return;
  n = parseInt(n, 10);
  if (type === "count" ? !(n >= 0) : (!n || n <= 0)) return;
  var key = type === "count" ? dayKey(logicalNow()) : (logDate || dayKey(logicalNow()));
  var bd = fromDayKey(key);
  var base = bd.getTime();
  var nextBase = new Date(bd.getFullYear(), bd.getMonth(), bd.getDate() + 1).getTime();
  var sameDay = events.filter(function (e) { return e.ts >= base && e.ts < nextBase; });
  var last = sameDay.reduce(function (m, e) { return Math.max(m, e.ts); }, base);
  var ts = Math.max(base + sameDay.length * 1000, last + 1000);
  var ev = { id: ts + "-" + Math.random().toString(36).slice(2,7), t: type, n: n, ts: ts };
  events = events.concat([ev]).sort(function (a, b) { return a.ts - b.ts; });
  save();
  undoEv = ev;
  if (undoTimer) clearTimeout(undoTimer);
  undoTimer = setTimeout(function () { undoEv = null; render(); }, 6000);
  render();
}

function removeEntry(id) {
  if (!canEdit) return;
  events = events.filter(function (e) { return e.id !== id; });
  save();
  if (undoEv && undoEv.id === id) undoEv = null;
  render();
}

/* ================================================================ */
/* stats                                                            */
/* ================================================================ */

function computeStats() {
  var sorted = events.slice().sort(function (a, b) { return a.ts - b.ts; });
  var sum = function (t) {
    return sorted.filter(function (e) { return e.t === t; })
                 .reduce(function (a, e) { return a + e.n; }, 0);
  };
  var bought = sum("buy");
  var eaten = sum("eat") + sum("away");

  /* The house count only means anything from the first "open" entry on.
     Eating before that came out of stock nobody was counting. */
  var firstOpen = sorted.filter(function (e) { return e.t === "open"; })[0];
  var invStart = firstOpen ? firstOpen.ts : (sorted.length ? sorted[0].ts : 0);
  /* Bananas eaten away from home ("away") count as eating everywhere, but
     they never came out of the house, so the house count and chart skip them. */
  var invEvents = sorted.filter(function (e) { return e.ts >= invStart && e.t !== "away"; });
  /* A "count" entry is a checkpoint: the number you actually saw at home.
     It overrides whatever the log said, so anything logged after it moves
     the house from there. */
  function stepHouse(run, e) {
    return e.t === "count" ? e.n : e.t === "eat" ? run - e.n : run + e.n;
  }
  var inventory = invEvents.reduce(stepHouse, 0);

  var now = logicalNow();
  var todayKey = dayKey(now);

  var eatByDay = {};
  sorted.forEach(function (e) {
    if (e.t !== "eat" && e.t !== "away") return;
    var k = dayKey(new Date(e.ts));
    eatByDay[k] = (eatByDay[k] || 0) + e.n;
  });

  /* Analytics run on complete days only — today is still in progress, and
     counting it would drag every average and record down until bedtime. */
  /* Step by calendar date, not by 24h of milliseconds: days are 23 or 25
     hours long when daylight saving shifts, and fixed steps would skip or
     double-count a day. */
  var firstDay = sorted.length ? midnight(new Date(sorted[0].ts)) : midnight(now);
  var todayMid = midnight(now);
  var days = [];
  for (var dd = firstDay; dd < todayMid;
       dd = new Date(dd.getFullYear(), dd.getMonth(), dd.getDate() + 1)) {
    var k = dayKey(dd);
    days.push({ key: k, date: dd, n: eatByDay[k] || 0 });
  }

  /* The Log tab's chart is the one place today appears as a bar, because
     watching it grow is the point. Days before tracking began are left
     empty rather than drawn as zero. */
  var logWin = [];
  for (var q = 20; q >= 0; q--) {
    var wd = new Date(todayMid.getFullYear(), todayMid.getMonth(), todayMid.getDate() - q);
    var wk = dayKey(wd);
    logWin.push({ key: wk, date: wd, n: wd < firstDay ? null : (eatByDay[wk] || 0) });
  }
  var daysTracked = days.length;
  var eatenComplete = days.reduce(function (a, x) { return a + x.n; }, 0);

  function bucket(src, fmtKey, fmtLabel) {
    var order = [], map = {};
    src.forEach(function (x) {
      var k = fmtKey(x.date);
      if (!map[k]) { map[k] = { key: k, label: fmtLabel(x.date), n: 0, days: 0 }; order.push(k); }
      map[k].n += x.n;
      map[k].days += 1;
    });
    return order.map(function (k) { return map[k]; });
  }
  var wkKey = function (d) { return dayKey(weekStart(d)); };
  var wkLab = function (d) { return shortDate(weekStart(d)); };
  var moKey = function (d) { return d.getFullYear() + "-" + pad2(d.getMonth()+1); };
  var moLab = function (d) { return MO[d.getMonth()] + " '" + String(d.getFullYear()).slice(2); };
  var yrKey = function (d) { return String(d.getFullYear()); };

  /* Records and averages use complete days only... */
  var weeks = bucket(days, wkKey, wkLab);
  var months = bucket(days, moKey, moLab);

  /* ...but every chart shows today, so it can be watched filling in. */
  var daysLive = sorted.length ? days.concat([{ key: todayKey, date: todayMid, n: eatByDay[todayKey] || 0 }]) : [];
  var liveWeeks = bucket(daysLive, wkKey, wkLab);
  var liveMonths = bucket(daysLive, moKey, moLab);
  var liveYears = bucket(daysLive, yrKey, yrKey);

  var wdTotal = [0,0,0,0,0,0,0], wdCount = [0,0,0,0,0,0,0], wdBest = [null,null,null,null,null,null,null];
  days.forEach(function (x) {
    var i = wdIndex(x.date);
    wdTotal[i] += x.n;
    wdCount[i] += 1;
    if (!wdBest[i] || x.n > wdBest[i].n) wdBest[i] = { n: x.n, date: x.date };
  });
  var weekday = WD.map(function (label, i) {
    return { label: label, long: WD_LONG[i],
             avg: wdCount[i] ? wdTotal[i]/wdCount[i] : 0,
             count: wdCount[i], best: wdBest[i] };
  });

  function maxOf(arr) {
    return arr.reduce(function (best, x) { return (!best || x.n > best.n) ? x : best; }, null);
  }
  var bestDay = maxOf(days.filter(function (x) { return x.n > 0; }));
  var bestWeek = maxOf(weeks);
  var bestMonth = maxOf(months);
  var runDays = {};
  sorted.forEach(function (e) { if (e.t === "buy") { var k = dayKey(new Date(e.ts)); runDays[k] = (runDays[k] || 0) + e.n; } });
  var runCount = Object.keys(runDays).length;
  var avgHaul = runCount ? bought / runCount : null;
  var biggestHaul = sorted.filter(function (e) { return e.t === "buy"; })
    .reduce(function (b, e) { return (!b || e.n > b.n) ? e : b; }, null);

  /* One equal step per entry, not a time axis: the data only knows order. */
  var run = 0, peakInv = 0, peakTs = null, invPts = [], dayTicks = [], seenDay = null;
  invEvents.forEach(function (e, i) {
    var before = run;
    run = stepHouse(run, e);
    if (run > peakInv) { peakInv = run; peakTs = e.ts; }
    var dk = dayKey(new Date(e.ts));
    if (dk !== seenDay) { seenDay = dk; dayTicks.push(i); }
    invPts.push({ i: i, ts: e.ts, v: run, t: e.t, n: e.n, was: before });
  });
  if (invPts.length) invPts.push({ i: invPts.length, ts: Date.now(), v: run, t: "now", n: 0 });

  function rate(k) {
    var w = days.slice(-k);
    return w.length ? w.reduce(function (a, x) { return a + x.n; }, 0) / w.length : 0;
  }
  var rate7 = rate(7), rate30 = rate(30);
  var daysLeft = (inventory > 0 && rate7 > 0) ? inventory / rate7 : null;

  /* Live counters, not averages, so these do include today. */
  var wkStart = weekStart(now).getTime();
  var moY = now.getFullYear(), moM = now.getMonth();
  var thisWeek = 0, thisMonth = 0;
  Object.keys(eatByDay).forEach(function (k) {
    var d = fromDayKey(k);
    if (d.getTime() >= wkStart) thisWeek += eatByDay[k];
    if (d.getFullYear() === moY && d.getMonth() === moM) thisMonth += eatByDay[k];
  });

  return {
    recent: sorted.slice().reverse().slice(0, 12),
    bought: bought, eaten: eaten, inventory: inventory,
    invStart: invStart, hasOpen: !!firstOpen,
    today: eatByDay[todayKey] || 0,
    thisWeek: thisWeek, thisMonth: thisMonth,
    days: days, weeks: weeks, months: months, daysTracked: daysTracked,
    daysLive: daysLive, liveWeeks: liveWeeks, liveMonths: liveMonths, liveYears: liveYears,
    weekday: weekday,
    bestDay: bestDay, bestWeek: bestWeek, bestMonth: bestMonth,
    biggestHaul: biggestHaul, peakInv: peakInv, peakTs: peakTs,
    avgHaul: avgHaul, runCount: runCount, eatByDay: eatByDay,
    rate7: rate7, rate30: rate30, daysLeft: daysLeft,
    avgAll: daysTracked ? eatenComplete / daysTracked : 0,
    invPts: invPts, dayTicks: dayTicks,
    logWin: logWin, todayKey: todayKey
  };
}

/* ================================================================ */
/* markup helpers                                                   */
/* ================================================================ */

function verbFor(t) {
  return t === "buy" ? "Bought" : t === "open" ? "Started with" : t === "away" ? "Ate out"
    : t === "count" ? "Counted" : "Ate";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

function glyph(size, dim) {
  var d = "M6.5 3.4 C5 10.5 8.6 17 18 18.6";
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" class="glyph" aria-hidden="true">' +
    '<path d="' + d + '" fill="none" stroke="var(--cocoa)" stroke-width="6.4" stroke-linecap="round" opacity="' + (dim ? .22 : .9) + '"/>' +
    '<path d="' + d + '" fill="none" stroke="' + (dim ? "var(--paper-2)" : "var(--peel)") + '" stroke-width="3.6" stroke-linecap="round"/>' +
    '<circle cx="6.2" cy="3.1" r="2" fill="var(--cocoa)" opacity="' + (dim ? .25 : 1) + '"/></svg>';
}

function section(title, note, body) {
  return '<section class="sec"><div class="sec-head"><h2>' + esc(title) + "</h2>" +
    (note ? '<span class="sec-note">' + esc(note) + "</span>" : "") +
    "</div>" + body + "</section>";
}

function card(label, n, when) {
  return '<li class="gcard"><div class="gcard-label">' + esc(label) + "</div>" +
    '<div class="gcard-n">' + (n == null ? "\u2014" : n) + "</div>" +
    '<div class="gcard-when">' + esc(when || "—") + "</div></li>";
}

function blank(text) {
  return '<div class="blank">' + glyph(34, true) + "<p>" + esc(text) + "</p></div>";
}

/* ================================================================ */
/* svg charts                                                       */
/* ================================================================ */

var NS = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function ticksFor(max) {
  if (!(max > 0)) return { top: 4, step: 1 };
  var raw = max / 4;
  var pow = Math.pow(10, Math.floor(Math.log10(raw)));
  var cands = [1, 2, 2.5, 5, 10].map(function (m) { return m * pow; });
  var step = cands.filter(function (c) { return c >= raw; })[0] || cands[cands.length - 1];
  step = Math.max(1, step);                       // no fractions of a banana on an axis
  return { top: Math.max(4, Math.ceil(max / step) * step), step: step };
}

function chartFrame(box, height) {
  box.innerHTML = "";
  var w = box.clientWidth || 340;
  var svg = el("svg", { width: w, height: height, viewBox: "0 0 " + w + " " + height });
  box.appendChild(svg);
  var tip = document.createElement("div");
  tip.className = "tip";
  box.appendChild(tip);
  return { svg: svg, tip: tip, w: w, h: height };
}

function axes(f, m, top, step) {
  var iw = f.w - m.l - m.r, ih = f.h - m.t - m.b;
  for (var v = 0; v <= top + 1e-9; v += step) {
    var y = m.t + ih - (v / top) * ih;
    f.svg.appendChild(el("line", {
      x1: m.l, x2: m.l + iw, y1: y, y2: y,
      stroke: "var(--line)", "stroke-width": 1
    }));
    var lab = el("text", {
      x: m.l - 6, y: y + 3.5, "text-anchor": "end",
      fill: "var(--cocoa-mute)", "font-size": 10
    });
    lab.textContent = String(round(v, 1));
    f.svg.appendChild(lab);
  }
  return { iw: iw, ih: ih };
}

function haloText(parent, attrs, text) {
  var g = el("g", {});
  var back = el("text", attrs);
  back.setAttribute("stroke", "var(--paper)");
  back.setAttribute("stroke-width", 4);
  back.setAttribute("stroke-linejoin", "round");
  back.setAttribute("fill", "var(--paper)");
  back.textContent = text;
  var front = el("text", attrs);
  front.textContent = text;
  g.appendChild(back); g.appendChild(front);
  parent.appendChild(g);
  return g;
}

function xLabel(f, x, text, anchor) {
  var t = el("text", {
    x: x, y: f.h - 5, "text-anchor": anchor || "middle",
    fill: "var(--cocoa-mute)", "font-size": 10
  });
  t.textContent = text;
  f.svg.appendChild(t);
}

function hover(f, rect, html, cx, cy) {
  rect.addEventListener("pointerenter", function () { showTip(f, html, cx, cy); });
  rect.addEventListener("pointerdown", function () { showTip(f, html, cx, cy); });
}

function showTip(f, html, cx, cy) {
  f.tip.innerHTML = html;
  f.tip.style.left = Math.max(48, Math.min(f.w - 48, cx)) + "px";
  f.tip.style.top = Math.max(34, cy - 8) + "px";
  f.tip.classList.add("on");
}

/* Bars take a fixed share of their slot, so a chart looks equally dense
   whether it holds 8 bars or 30. opts.barW only caps them when there are few.
   With opts.liveLast, the last bar is the period still in progress: yellow,
   outlined, and carrying its count, same as on the Log tab. */
function barChart(box, data, opts) {
  if (!box) return;
  var f = chartFrame(box, opts.height);
  var hasSub = data.some(function (d) { return d.sub; });
  var m = { l: 30, r: 8, t: (opts.valueLabels || opts.liveLast) ? 24 : 14, b: hasSub ? 34 : 20 };
  var max = data.reduce(function (a, d) { return Math.max(a, d.n); }, 0);
  var tk = ticksFor(max);
  var g = axes(f, m, tk.top, tk.step);
  var slot = g.iw / Math.max(1, data.length);
  var bw = Math.min(opts.maxBar || 96, slot * 0.8);
  var base = m.t + g.ih;
  var labels = [];

  data.forEach(function (d, i) {
    var cx = m.l + slot * (i + 0.5);
    var y = base - (d.n / tk.top) * g.ih;
    var live = opts.liveLast && i === data.length - 1;
    if (d.n > 0) {
      var r = el("rect", {
        x: cx - bw/2, y: y, width: bw, height: Math.max(1.5, base - y), rx: 2.5,
        fill: live ? "var(--peel)" : (opts.colorFor ? opts.colorFor(d, i) : "var(--tan-2)")
      });
      if (live) { r.setAttribute("stroke", "var(--cocoa)"); r.setAttribute("stroke-width", 1.5); }
      f.svg.appendChild(r);
    }
    if (live || (opts.valueLabels && d.n > 0)) {
      labels.push({ x: cx, y: y - 7, text: String(round(d.n, 1)), live: live });
    }
    if (opts.allLabels) {
      var main = el("text", {
        x: cx, y: hasSub ? f.h - 19 : f.h - 5, "text-anchor": "middle",
        fill: hasSub ? "var(--cocoa)" : "var(--cocoa-mute)",
        "font-size": hasSub ? 11.5 : 10, "font-weight": hasSub ? 700 : 400
      });
      main.textContent = d.label;
      f.svg.appendChild(main);
      if (d.sub) {
        var sub = el("text", {
          x: cx, y: f.h - 5, "text-anchor": "middle", fill: "var(--cocoa-mute)", "font-size": 10
        });
        sub.textContent = d.sub;
        f.svg.appendChild(sub);
      }
    }
    var hit = el("rect", { x: m.l + slot*i, y: m.t, width: slot, height: g.ih, fill: "transparent" });
    f.svg.appendChild(hit);
    var html = opts.tip ? opts.tip(d, live)
      : '<div class="d">' + esc(d.label) + "</div><div><b>" + round(d.n, 1) + "</b> " +
        esc(opts.unit || "bananas") + "</div>";
    hover(f, hit, html, cx, y);
  });

  if (opts.line) {
    var segs = [], cur = [];
    data.forEach(function (d, i) {
      if (d.ma == null) { if (cur.length) segs.push(cur); cur = []; return; }
      cur.push([m.l + slot * (i + 0.5), base - (d.ma / tk.top) * g.ih]);
    });
    if (cur.length) segs.push(cur);
    segs.forEach(function (seg) {
      if (seg.length < 2) return;
      var dd = "M " + seg.map(function (q) { return q[0] + " " + q[1]; }).join(" L ");
      f.svg.appendChild(el("path", { d: dd, fill: "none", stroke: "var(--paper)", "stroke-width": 6,
        "stroke-linejoin": "round", "stroke-linecap": "round", "pointer-events": "none" }));
      f.svg.appendChild(el("path", { d: dd, fill: "none", stroke: "var(--cocoa)", "stroke-width": 2.5,
        "stroke-linejoin": "round", "stroke-linecap": "round", "pointer-events": "none" }));
    });
  }

  labels.forEach(function (l) {
    haloText(f.svg, {
      x: l.x, y: l.y, "text-anchor": "middle", fill: "var(--cocoa)",
      "font-size": l.live ? 13 : 12, "font-weight": l.live ? 800 : 700
    }, l.text);
  });

  if (!opts.allLabels && data.length) {
    var last = data.length - 1;
    var lastText = opts.lastLabel || data[last].label;
    if (data.length > 1) xLabel(f, m.l + slot * 0.5, data[0].label, "start");
    xLabel(f, m.l + slot * (last + 0.5) + Math.min(bw/2, slot/2), lastText, "end");
  }
  box.addEventListener("pointerleave", function () { f.tip.classList.remove("on"); });
}

/* The inventory chart. One equal step per logged entry. Each grocery run is
   labelled at both ends of its jump: how low the house got before it (a
   hollow dot) and how full it was after (a solid dot). The current count is
   marked in yellow at the right. Labels that would collide are dropped,
   smallest grocery runs first. */
function stepChart(box, pts, dayTicks, height) {
  if (!box || !pts.length) return;
  var f = chartFrame(box, height);
  var m = { l: 30, r: 10, t: 22, b: 20 };
  var max = pts.reduce(function (a, p) { return Math.max(a, p.v); }, 0);
  var tk = ticksFor(max);
  var g = axes(f, m, tk.top, tk.step);
  var n = pts.length;
  var base = m.t + g.ih;
  var X = function (i) { return m.l + (n === 1 ? g.iw/2 : (i/(n-1)) * g.iw); };
  var Y = function (v) { return base - (v/tk.top) * g.ih; };

  dayTicks.slice(1).forEach(function (i) {
    f.svg.appendChild(el("line", {
      x1: X(i), x2: X(i), y1: m.t, y2: base,
      stroke: "var(--line-strong)", "stroke-dasharray": "2 4", "stroke-width": 1
    }));
  });

  var d = "M " + X(0) + " " + Y(pts[0].v);
  for (var i = 1; i < n; i++) {
    d += " L " + X(i) + " " + Y(pts[i-1].v) + " L " + X(i) + " " + Y(pts[i].v);
  }
  var grad = el("linearGradient", { id: "invFill", x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(el("stop", { offset: "0%", "stop-color": "var(--peel)", "stop-opacity": .85 }));
  grad.appendChild(el("stop", { offset: "100%", "stop-color": "var(--peel)", "stop-opacity": .12 }));
  var defs = el("defs", {}); defs.appendChild(grad); f.svg.appendChild(defs);
  f.svg.appendChild(el("path", {
    d: d + " L " + X(n-1) + " " + base + " L " + X(0) + " " + base + " Z",
    fill: "url(#invFill)", stroke: "none"
  }));
  f.svg.appendChild(el("path", { d: d, fill: "none", stroke: "var(--cocoa)", "stroke-width": 2 }));

  /* date labels, thinned so they never overlap */
  var lastX = -Infinity;
  dayTicks.forEach(function (i) {
    var x = X(i);
    if (x - lastX < 52 || x + 18 > f.w) return;
    xLabel(f, x, shortDate(new Date(pts[i].ts)), x - 18 < m.l ? "start" : "middle");
    lastX = x;
  });

  /* tooltips */
  pts.forEach(function (p, i) {
    var x0 = i === 0 ? m.l : (X(i-1) + X(i)) / 2;
    var x1 = i === n-1 ? m.l + g.iw : (X(i) + X(i+1)) / 2;
    var hit = el("rect", { x: x0, y: m.t, width: Math.max(1, x1-x0), height: g.ih, fill: "transparent" });
    f.svg.appendChild(hit);
    var verb = p.t === "buy" ? "Bought" : p.t === "eat" ? "Ate" : p.t === "open" ? "Started with"
      : p.t === "count" ? "Counted" : null;
    var html = p.t === "count"
      ? '<div class="d">' + esc(niceDate(new Date(p.ts))) + "</div>" +
        "<div>Counted <b>" + p.v + "</b> in the house</div>" +
        "<div>log said " + p.was + "</div>"
      : '<div class="d">' + (verb ? esc(niceDate(new Date(p.ts))) : "Right now") + "</div>" +
        "<div>" + (verb ? esc(verb + " " + p.n) + " \u2014 " : "") + "<b>" + p.v + "</b> in the house</div>";
    hover(f, hit, html, X(i), Y(p.v));
  });

  /* count checkpoints: a ring where you checked the log against reality */
  pts.forEach(function (p, i) {
    if (p.t !== "count") return;
    f.svg.appendChild(el("circle", {
      cx: X(i), cy: Y(p.v), r: 3.6, fill: "var(--paper)", stroke: "var(--tan-2)", "stroke-width": 2
    }));
  });

  /* peaks, valleys and now. A grocery run is labelled at both ends of its
     jump or not at all, so a dot never appears without its partner. */
  var now = pts[n-1];
  var nowC = { x: X(n-1), y: Y(now.v), text: now.v + " now", kind: "now" };
  var runs = [];
  for (var j = 1; j < n; j++) {
    if (pts[j].t !== "buy") continue;
    var start = j, size = 0;
    while (j < n && pts[j].t === "buy") { size += pts[j].n; j++; }
    var end = j - 1;
    runs.push({ pri: size, items: [
      { x: X(start), y: Y(pts[start-1].v), text: String(pts[start-1].v), kind: "valley" },
      { x: X(end), y: Y(pts[end].v), text: String(pts[end].v), kind: "peak" }
    ]});
  }
  runs.sort(function (a, b) { return b.pri - a.pri; });

  var placed = [];
  function clear(b) {
    if (b.x0 < m.l - 2 || b.x1 > f.w - 1 || b.y0 < 0 || b.y1 > base + 1) return false;
    for (var k = 0; k < placed.length; k++) {
      var q = placed[k];
      if (b.x0 < q.x1 && b.x1 > q.x0 && b.y0 < q.y1 && b.y1 > q.y0) return false;
    }
    return true;
  }
  function spotFor(c) {
    var fs = c.kind === "now" ? 12 : 11;
    var w = c.text.length * (fs * 0.6) + 4;
    var tries = c.kind === "peak"   ? [["middle", c.x, c.y - 7]]
              : c.kind === "valley" ? [["middle", c.x, c.y + 16], ["end", c.x - 5, c.y + 4]]
              :                       [["end", c.x - 3, c.y - 8], ["end", c.x - 3, c.y + 17]];
    for (var t = 0; t < tries.length; t++) {
      var ax = tries[t][0], tx = tries[t][1], ty = tries[t][2];
      var x0 = ax === "middle" ? tx - w/2 : tx - w;
      var b = { x0: x0, x1: x0 + w, y0: ty - fs, y1: ty + 3 };
      if (clear(b)) return { b: b, ax: ax, tx: tx, ty: ty, fs: fs };
    }
    return null;
  }
  function draw(c, sp) {
    f.svg.appendChild(el("circle", c.kind === "valley"
      ? { cx: c.x, cy: c.y, r: 3.2, fill: "var(--paper)", stroke: "var(--cocoa)", "stroke-width": 1.6 }
      : c.kind === "peak"
      ? { cx: c.x, cy: c.y, r: 3.2, fill: "var(--cocoa)" }
      : { cx: c.x, cy: c.y, r: 4.2, fill: "var(--peel)", stroke: "var(--cocoa)", "stroke-width": 1.6 }));
    haloText(f.svg, {
      x: sp.tx, y: sp.ty, "text-anchor": sp.ax,
      fill: c.kind === "valley" ? "var(--cocoa-2)" : "var(--cocoa)",
      "font-size": sp.fs, "font-weight": c.kind === "valley" ? 700 : 800
    }, c.text);
  }

  var nowSpot = spotFor(nowC);
  if (nowSpot) placed.push(nowSpot.b);
  runs.forEach(function (run) {
    var lo = spotFor(run.items[0]);
    if (!lo) return;
    placed.push(lo.b);
    var hi = spotFor(run.items[1]);
    if (!hi) { placed.pop(); return; }
    placed.push(hi.b);
    draw(run.items[0], lo);
    draw(run.items[1], hi);
  });
  if (nowSpot) draw(nowC, nowSpot);
  box.addEventListener("pointerleave", function () { f.tip.classList.remove("on"); });
}

/* Average bananas by weekday as a line through the week. Weekdays with no
   complete days yet are skipped rather than drawn as zero. The highest
   weekday gets a solid dot. */
function lineChart(box, data, opts) {
  if (!box) return;
  var f = chartFrame(box, opts.height);
  var m = { l: 30, r: 12, t: 26, b: 20 };
  var max = data.reduce(function (a, d) { return Math.max(a, d.count ? d.n : 0); }, 0);
  var tk = ticksFor(max);
  var g = axes(f, m, tk.top, tk.step);
  var base = m.t + g.ih;
  var slot = g.iw / data.length;
  var X = function (i) { return m.l + slot * (i + 0.5); };
  var Y = function (v) { return base - (v / tk.top) * g.ih; };

  var grad = el("linearGradient", { id: "wdFill", x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(el("stop", { offset: "0%", "stop-color": "var(--peel)", "stop-opacity": .7 }));
  grad.appendChild(el("stop", { offset: "100%", "stop-color": "var(--peel)", "stop-opacity": .08 }));
  var defs = el("defs", {}); defs.appendChild(grad); f.svg.appendChild(defs);

  var segs = [], cur = [];
  data.forEach(function (d, i) {
    if (d.count) cur.push([X(i), Y(d.n)]);
    else { if (cur.length) segs.push(cur); cur = []; }
  });
  if (cur.length) segs.push(cur);
  segs.forEach(function (seg) {
    if (seg.length < 2) return;
    var path = "M " + seg.map(function (p) { return p[0] + " " + p[1]; }).join(" L ");
    f.svg.appendChild(el("path", {
      d: path + " L " + seg[seg.length-1][0] + " " + base + " L " + seg[0][0] + " " + base + " Z",
      fill: "url(#wdFill)", stroke: "none"
    }));
    f.svg.appendChild(el("path", {
      d: path, fill: "none", stroke: "var(--cocoa)", "stroke-width": 2.2,
      "stroke-linejoin": "round", "stroke-linecap": "round"
    }));
  });

  var top = data.reduce(function (a, d) { return d.count && d.n > a ? d.n : a; }, -1);
  data.forEach(function (d, i) {
    xLabel(f, X(i), d.label);
    if (!d.count) return;
    var best = d.n === top;
    f.svg.appendChild(el("circle", {
      cx: X(i), cy: Y(d.n), r: best ? 4.6 : 3.8,
      fill: best ? "var(--cocoa)" : "var(--paper)", stroke: "var(--cocoa)", "stroke-width": 2
    }));
    haloText(f.svg, {
      x: X(i), y: Y(d.n) - 10, "text-anchor": "middle",
      fill: "var(--cocoa)", "font-size": 12, "font-weight": best ? 800 : 700
    }, String(round(d.n, 1)));
    var hit = el("rect", { x: m.l + slot * i, y: m.t, width: slot, height: g.ih, fill: "transparent" });
    f.svg.appendChild(hit);
    hover(f, hit, '<div class="d">' + esc(d.long) + "s</div><div><b>" + round(d.n, 1) +
      "</b> a day on average</div><div>from " + d.count + " " + esc(d.long) + (d.count === 1 ? "" : "s") + "</div>",
      X(i), Y(d.n));
  });
  box.addEventListener("pointerleave", function () { f.tip.classList.remove("on"); });
}

/* The Log tab's chart. The bar for the day you're logging to is yellow and
   carries its own count; a dashed line marks your average so you can watch
   the day climb toward it. When the count changes, the bar grows into place. */
var lastBar = null;

function logChart(box, win, opts) {
  if (!box) return;
  var f = chartFrame(box, opts.height);
  var m = { l: 30, r: 8, t: 24, b: 20 };
  var max = win.reduce(function (a, d) { return Math.max(a, d.n || 0); }, 0);
  max = Math.max(max, opts.avg || 0, 1);
  var tk = ticksFor(max);
  var g = axes(f, m, tk.top, tk.step);
  var n = win.length;
  var slot = g.iw / n;
  var bw = Math.min(opts.barW, slot * 0.78);
  var Y = function (v) { return m.t + g.ih - (v / tk.top) * g.ih; };
  var hiBar = null, hiLabel = null, hiN = null, hiIdx = -1, hiLabelAt = null;

  win.forEach(function (d, i) {
    if (d.n == null) return;
    var cx = m.l + slot * (i + 0.5);
    var hi = d.key === opts.highlightKey;
    var y = Y(d.n);
    if (d.n > 0) {
      var r = el("rect", {
        x: cx - bw/2, y: y, width: bw, height: Math.max(1.5, m.t + g.ih - y), rx: 2.5,
        fill: hi ? "var(--peel)" : "var(--tan-2)"
      });
      if (hi) {
        r.setAttribute("stroke", "var(--cocoa)");
        r.setAttribute("stroke-width", 1.5);
        r.setAttribute("vector-effect", "non-scaling-stroke");
        r.setAttribute("class", "grow");
        hiBar = r;
      }
      f.svg.appendChild(r);
    }
    if (hi) {
      hiN = d.n; hiIdx = i;
      hiLabelAt = { x: cx, y: y - 7 };
    }
    var hit = el("rect", { x: m.l + slot*i, y: m.t, width: slot, height: g.ih, fill: "transparent" });
    f.svg.appendChild(hit);
    var isToday = d.key === opts.todayKey;
    hover(f, hit, '<div class="d">' + (isToday ? "Today" : esc(niceDate(d.date))) + "</div><div><b>" +
      d.n + "</b> " + (isToday ? "so far" : (d.n === 1 ? "banana" : "bananas")) + "</div>", cx, y);
  });

  /* average line, drawn over the bars with a halo so it stays readable */
  if (opts.avg > 0) {
    var ay = Y(opts.avg);
    f.svg.appendChild(el("line", {
      x1: m.l, x2: m.l + g.iw, y1: ay, y2: ay,
      stroke: "var(--cocoa)", "stroke-width": 1.25, "stroke-dasharray": "4 4", opacity: .6
    }));
    haloText(f.svg, {
      x: m.l + 3, y: ay - 5, "text-anchor": "start",
      fill: "var(--cocoa-2)", "font-size": 10.5, "font-weight": 700
    }, "30-day avg " + round(opts.avg, 1));
  }

  if (hiLabelAt) {
    hiLabel = haloText(f.svg, {
      x: hiLabelAt.x, y: hiLabelAt.y, "text-anchor": "middle",
      fill: "var(--cocoa)", "font-size": 13, "font-weight": 800
    }, String(hiN));
    hiLabel.setAttribute("class", "lift");
  }

  /* x labels: the highlighted day, today, and Mondays that don't crowd them */
  var taken = [];
  function label(i, text) {
    for (var j = 0; j < taken.length; j++) if (Math.abs(taken[j] - i) < 3) return;
    taken.push(i);
    xLabel(f, m.l + slot * (i + 0.5), text, i === n - 1 ? "end" : "middle");
  }
  label(n - 1, "Today");
  if (hiIdx >= 0 && hiIdx !== n - 1) label(hiIdx, shortDate(win[hiIdx].date));
  win.forEach(function (d, i) {
    if (d.n != null && wdIndex(d.date) === 0) label(i, shortDate(d.date));
  });

  /* grow the bar from where it was last time, if we're still on the same day */
  if (hiBar && lastBar && lastBar.key === opts.highlightKey && lastBar.n !== hiN && hiN > 0) {
    hiBar.style.transform = "scaleY(" + (lastBar.n / hiN) + ")";
    if (hiLabel) hiLabel.style.transform = "translateY(" + (Y(lastBar.n) - Y(hiN)) + "px)";
    hiBar.getBoundingClientRect();
    requestAnimationFrame(function () {
      hiBar.style.transform = "scaleY(1)";
      if (hiLabel) hiLabel.style.transform = "translateY(0)";
    });
  }
  lastBar = { key: opts.highlightKey, n: hiN };

  box.addEventListener("pointerleave", function () { f.tip.classList.remove("on"); });
}

function viewLog(S) {

  h += '<div class="' + (back ? "daybar daybar-back" : "daybar") + '">' +

    "</div></div>";

  if (early) h += '<p class="dayhint">It\u2019s before 4:30am, so Today still means ' + esc(niceDate(lnow)) + ".</p>";

  h += '<div class="pad"><div class="pad-head">' +

    '</div><div class="lg-recent">';

  if (S.recent.length) {

      return "<li>" +

        '<span class="feed-n">' + e.n + "</span>" +

function tickerHTML(S) {
  return '<div class="ticker"><span><b>' + S.inventory + "</b> in the house</span>" +

function spanText(list) {
  var a = list[0].date, b = list[list.length - 1].date;
  if (list.length === 1) return shortDate(a);
  return shortDate(a) + " \u2013 " + (a.getMonth() === b.getMonth() ? b.getDate() : shortDate(b));

function viewTrends(S) {

function perDay(b) { return round(b.n / Math.max(1, b.days), 1) + " a day"; }

/* Calendar heatmap: one block per month, each day shaded by bananas eaten.
   Days before tracking began, and days still to come, are left blank. */
var HEAT = ["rgba(70,46,20,.07)", "#F7D566", "#EFBB1C", "#C89A62", "#AC7C43", "#6B4A24"];
function heatmapHTML(S) {
  if (!S.days.length) return "";
  var first = S.days[0].date, today = midnight(logicalNow());
  var max = Object.keys(S.eatByDay).reduce(function (a, k) { return Math.max(a, S.eatByDay[k]); }, 1);
  var level = function (n) { return n <= 0 ? 0 : Math.min(5, 1 + Math.floor((n - 1) * 5 / max)); };
  var lo = function (lv) { return lv === 1 ? 1 : Math.floor((lv - 1) * max / 5) + 1; };
  var hi = function (lv) { return lv === 5 ? max : Math.floor(lv * max / 5); };
  var months = [];
  for (var m = new Date(first.getFullYear(), first.getMonth(), 1); m <= today; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
    var cells = ["M","T","W","T","F","S","S"].map(function (w) { return '<div class="cal-w">' + w + "</div>"; }).join("");
    for (var b = 0; b < wdIndex(m); b++) cells += '<div class="cal-d cal-blank"></div>';
    var last = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    for (var d = 1; d <= last; d++) {
      var day = new Date(m.getFullYear(), m.getMonth(), d);
      var isToday = day.getTime() === today.getTime();
      if (day < first || day > today) {
        cells += '<div class="cal-d cal-off"><span class="cal-num">' + d + "</span></div>";
        continue;
      }
      var n = S.eatByDay[dayKey(day)] || 0, lv = level(n);
      cells += '<div class="cal-d lv' + lv + (isToday ? " cal-today" : "") + '" style="background:' + HEAT[lv] + '" title="' +
        esc(niceDate(day) + ": " + n + (n === 1 ? " banana" : " bananas") + (isToday ? " so far" : "")) + '">' +
        '<span class="cal-num">' + d + "</span><b>" + n + "</b></div>";
    }
    months.push('<div class="cal-month"><div class="cal-title">' + MO[m.getMonth()] + " " + m.getFullYear() +
      '</div><div class="cal-grid">' + cells + "</div></div>");
  }
  var key = '<div class="cal-key"><span>Fewer</span>' + [0,1,2,3,4,5].map(function (lv) {
    var label = lv === 0 ? "0" : (lo(lv) === hi(lv) ? String(lo(lv)) : lo(lv) + "\u2013" + hi(lv));
    return '<span class="cal-sw"><i style="background:' + HEAT[lv] + '"></i>' + label + "</span>";
  }).join("") + "<span>More</span></div>";
  return section("Banana calendar", "bananas eaten each day", key + '<div class="cal">' + months.join("") + "</div>");
}

function viewRecords(S) {

  var stats = {

      ["Most in a day", S.bestDay && S.bestDay.n, S.bestDay && niceDate(S.bestDay.date)],
      ["Most in a week", S.bestWeek && S.bestWeek.n, S.bestWeek && "week of " + S.bestWeek.label + ", " + perDay(S.bestWeek)],
      ["Most in a month", S.bestMonth && S.bestMonth.n, S.bestMonth && S.bestMonth.label + ", " + perDay(S.bestMonth)]
    ],
    house: [
      ["Biggest haul", S.biggestHaul && S.biggestHaul.n, S.biggestHaul && niceDate(new Date(S.biggestHaul.ts))],
      ["Fullest house", S.peakInv, S.peakTs && niceDate(new Date(S.peakTs))],
      ["Average haul", S.avgHaul == null ? null : Math.round(S.avgHaul),

    ],

    ]
  };

  /* Desktop: the chart on the left, the numbers as plain lists on the right. */
  if (wide()) {

      return '<div class="rlist-group"><h2 class="rec-h">' + esc(title) + '</h2><ul class="rlist">' +
        rows.map(function (r) {
          return '<li><div><div class="rl-label">' + esc(r[0]) + '</div><div class="rl-when">' + esc(r[2] || "—") +
            '</div></div><div class="rl-n">' + (r[1] == null ? "—" : r[1]) + "</div></li>";
        }).join("") + "</ul></div>";
    };

      list("Personal bests", stats.bests) + list("The house", stats.house) + list("Lifetime", stats.life) +
      "</div></div>";
  }

  var cards = function (rows) { return rows.map(function (r) { return card(r[0], r[1], r[2]); }).join(""); };
  return section("Personal bests", "",
      '<ul class="gcards gcards-3">' + cards(stats.bests) + "</ul>" +
      '<ul class="gcards gcards-3 gcards-gap">' + cards(stats.house) + "</ul>") +
    wdChart +
    section("Lifetime", "", '<ul class="gcards">' + cards(stats.life) + "</ul>") +
    heatmapHTML(S);
}

/* Only shows for the device holding the key. */
function viewData(S) {

function viewSheet(S) {

      '<label class="field"><span>Key</span>' +

  } else {

    title = "Export or import";

function render() {
  if (wide() && tab === "log") tab = "trends";
  if (tab === "data" && !canEdit) tab = wide() ? "trends" : "log";
  var keepY = window.scrollY;
  var S = computeStats();
  var body = tab === "log" ? viewLog(S)
    : tab === "trends" ? viewTrends(S)
    : tab === "data" ? viewData(S)
    : viewRecords(S);

  var undo = "";
  if (undoEv) {
    undo = '<div class="undo"><span>' +
      verbFor(undoEv.t) +
      " " + undoEv.n + "</span>" +
      '<button data-act="undo">Undo</button></div>';
  }

  var tabs = '<nav class="tabs"><a class="brand" href="/">Banana Counter</a>' +
    (wide() ? [["trends","Trends"],["records","Stats"]] : [["log","Log"],["trends","Trends"],["records","Stats"]])
      .concat(canEdit ? [["data","Data"]] : []).map(function (p) {
      return '<button class="tab' + (tab === p[0] ? " tab-on" : "") +
        '" data-act="tab" data-v="' + p[0] + '">' + p[1] + "</button>";
    }).join("") + "</nav>";

  document.getElementById("app").innerHTML =
    '<main class="wrap">' + body + "</main>" + undo + tabs + viewSheet(S);

  if (tab === "trends" && events.length) drawTrends(S);
  if (tab === "records" && events.length) drawRecords(S);
  if (tab === "log") {
    logChart(document.getElementById("chart-log"), S.logWin, {
      height: wide() ? 260 : 150, barW: wide() ? 18 : 11, avg: S.rate30,
      highlightKey: logDate || S.todayKey, todayKey: S.todayKey
    });
  }
  /* Redrawing empties the charts for a moment, which would bounce the page to the top.
     Put it back where it was. (Switching tabs scrolls to the top on purpose, after this.) */
  if (keepY) window.scrollTo(0, keepY);
}

/* Daily bars for the chosen range. Each full day also carries the average of
   it and the six days before it; today is still in progress, so it gets none. */
function dayRows(S) {
  var all = S.daysLive, vals = all.map(function (d) { return d.n; });
  var shown = dayRange === "all" ? all.length : Math.min(all.length, Number(dayRange));
  var start = all.length - shown;
  return all.slice(start).map(function (d, k) {
    var i = start + k, ma = null;
    if (i >= 6 && i < all.length - 1) {
      ma = vals.slice(i - 6, i + 1).reduce(function (a, b) { return a + b; }, 0) / 7;
    }
    return { label: shortDate(d.date), n: d.n, ma: ma };
  });
}

function drawTrends(S) {
  var cfg = range === "day"
      ? { rows: dayRows(S), cap: 16, live: "Today" }
    : range === "week"
      ? { rows: S.liveWeeks.slice(-16).map(function (w) { return { label: w.label, n: w.n }; }),
          cap: 22, live: "This week" }
    : range === "month"
      ? { rows: S.liveMonths.slice(-14).map(function (m) { return { label: m.label, n: m.n }; }),
          cap: 30, live: "This month" }
      : { rows: S.liveYears.map(function (y) { return { label: y.label, n: y.n }; }),
          cap: 42, live: "This year" };

  barChart(document.getElementById("chart-eaten"), cfg.rows, {
    height: wide() ? 420 : 210, barW: cfg.cap, liveLast: true, lastLabel: cfg.live,
    line: range === "day" && showMA,
    tip: function (d, live) {
      var title = live ? cfg.live : (range === "week" ? "Week of " + d.label : d.label);
      return '<div class="d">' + esc(title) + "</div><div><b>" + d.n + "</b> " +
        (live ? "so far" : (d.n === 1 ? "banana" : "bananas")) + "</div>" +
        (range === "day" && showMA && d.ma != null ? "<div>7-day average <b>" + round(d.ma, 1) + "</b></div>" : "");
    }
  });

  stepChart(document.getElementById("chart-house"), S.invPts, S.dayTicks, wide() ? 360 : 210);

  if (S.days.length) {
    lineChart(document.getElementById("chart-week"), S.weekday.map(function (w) {
      return { label: w.label, long: w.long, n: w.avg, count: w.count };
    }), { height: wide() ? 360 : 200 });
  }
}

function drawRecords(S) {
  if (!S.days.length) return;
  var top = S.weekday.reduce(function (a, w) { return Math.max(a, w.best ? w.best.n : 0); }, 0);
  barChart(document.getElementById("chart-wdbest"), S.weekday.map(function (w) {
    var has = w.best && w.best.n > 0;
    return { label: w.label, long: w.long, n: has ? w.best.n : 0,
             sub: has ? shortDate(w.best.date) : "\u2014", date: has ? w.best.date : null };
  }), {
    height: wide() ? 460 : 214, barW: 28, allLabels: true, valueLabels: true,
    colorFor: function (d) { return d.n === top && top > 0 ? "var(--cocoa)" : "var(--tan)"; },
    tip: function (d) {
      return d.date
        ? '<div class="d">' + esc(niceDate(d.date)) + "</div><div><b>" + d.n +
          "</b> bananas, your best " + esc(d.long) + "</div>"
        : '<div class="d">' + esc(d.long) + "s</div><div>No full " + esc(d.long) + "s yet</div>";
    }
  });
}

document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");

  /* Clicking inside the sheet shouldn't dismiss it; clicking the dim area should. */
  if (act === "close" && t.classList.contains("scrim") && ev.target.closest("[data-stop]")) return;

  switch (act) {
    case "eat":
      addEntry("eat", t.getAttribute("data-n"));
      break;
    case "buy": {
      var f = document.getElementById("buyqty");
      var v = f ? f.value : "";
      if (parseInt(v, 10) > 0) { buyDraft = ""; addEntry("buy", v); }
      break;
    }
    case "tab":
      tab = t.getAttribute("data-v"); render(); window.scrollTo(0, 0); break;
    case "ma":
      showMA = !showMA;
      try { localStorage.setItem("banana-ma", showMA ? "1" : "0"); } catch (e) {}
      render(); break;
    case "dayrange":
      dayRange = t.getAttribute("data-v");
      try { localStorage.setItem("banana-dayrange", dayRange); } catch (e) {}
      render(); break;
    case "range":
      range = t.getAttribute("data-v"); render(); break;
    case "day": {
      var v2 = t.getAttribute("data-v");
      logDate = v2 === "today" ? null : v2;
      render(); break;
    }
    case "del":
      removeEntry(t.getAttribute("data-id")); break;
    case "undo":
      if (undoEv) removeEntry(undoEv.id); break;
    case "sheet":
      importErr = ""; sheet = t.getAttribute("data-v"); render();
      var ci = document.getElementById("customn") || document.getElementById("countn");
      if (ci) { ci.focus(); if (ci.select) ci.select(); }
      break;
    case "close":
      sheet = null; importErr = ""; render(); break;
    case "savecount": {
      var cn = document.getElementById("countn");
      if (cn && cn.value !== "" && parseInt(cn.value, 10) >= 0) { sheet = null; addEntry("count", cn.value); }
      break;
    }
    case "savecustom": {
      var c = document.getElementById("customn");
      if (c && parseInt(c.value, 10) > 0) { sheet = null; addEntry(customType(), c.value); }
      break;
    }
    case "savekey": {
      var ki = document.getElementById("keyin");
      var kv = ki ? ki.value.trim() : "";
      if (kv) {
        try { localStorage.setItem(KEY_STORE, kv); } catch (e) {}
        canEdit = true; sheet = null; syncState = "idle";
        render(); pull();
      }
      break;
    }
    case "import": {
      if (!canEdit) break;
      var box = document.getElementById("dump");
      try {
        var parsed = JSON.parse(box.value);
        if (!Array.isArray(parsed)) throw new Error("shape");
        var ok = parsed.filter(function (e) {
          return e && ["eat","away","buy","open","count"].indexOf(e.t) >= 0 &&
            (e.t === "count" ? e.n >= 0 : e.n > 0) && (e.d || e.ts);
        }).map(function (e) {
          return { d: e.d || dayKey(new Date(e.ts)), t: e.t, n: Number(e.n) };
        });
        if (!ok.length) throw new Error("empty");
        events = expandDays(ok);
        save();
        sheet = null; importErr = "";
      } catch (err) {
        importErr = "That isn\u2019t a valid entry list. Paste the full text from an export.";
      }
      render();
      break;
    }
  }
});

document.addEventListener("input", function (ev) {
  if (ev.target.id === "buyqty") buyDraft = ev.target.value;
  if (ev.target.id === "countn") {
    var logSays = computeStats().inventory, v = parseInt(ev.target.value, 10), out = document.getElementById("countdiff");
    if (out) out.textContent = isNaN(v) || v === logSays ? "The log says " + logSays + "."
      : "The log says " + logSays + ", so this " + (v < logSays ? "removes " + (logSays - v) : "adds " + (v - logSays)) + ".";
  }
});

document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t.getAttribute && t.getAttribute("data-act") === "datepick") {
    var tKey = dayKey(logicalNow());
    logDate = (t.value && t.value !== tKey) ? t.value : null;
    render();
  }
});

document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape" && sheet) { sheet = null; importErr = ""; render(); return; }
  if (ev.key !== "Enter") return;
  if (ev.target.id === "buyqty") {
    if (parseInt(ev.target.value, 10) > 0) { buyDraft = ""; addEntry("buy", ev.target.value); }
  } else if (ev.target.id === "countn") {
    if (ev.target.value !== "" && parseInt(ev.target.value, 10) >= 0) { sheet = null; addEntry("count", ev.target.value); }
  } else if (ev.target.id === "customn") {
    if (parseInt(ev.target.value, 10) > 0) { var ty = customType(); sheet = null; addEntry(ty, ev.target.value); }
  }
});

var rz, lastW = window.innerWidth;
window.addEventListener("resize", function () {
  clearTimeout(rz);
  rz = setTimeout(function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth; render();
  }, 150);
});
