<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every therapy session · Connor Van Scyoc</title>
<meta name="description" content="A calendar of every therapy session Connor Van Scyoc has had since June 2022.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0f1115; --ink: #eceef2; --muted: #8c93a3; --faint: #5e6574; --accent: #8fb4ff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Archivo", system-ui, sans-serif; font-size: 17px; line-height: 1.5; }
  a { color: var(--accent); text-underline-offset: 3px; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 clamp(12px, 3vw, 24px); }
  .top { padding: 18px 0 0; }
  .home { font-weight: 700; color: var(--ink); text-decoration: none; }
  .home:hover { text-decoration: underline; }
  /* Fit the whole calendar on one screen, like the original story. */
  svg { display: block; width: 100%; height: auto; max-height: calc(100svh - 64px); }
  svg text { font-family: Inter, system-ui, sans-serif; }
  .status { color: var(--muted); margin: 40px 0; }
  .foot { color: var(--faint); font-size: 14px; margin: 8px 0 64px; max-width: 70ch; }
  .tip { position: fixed; pointer-events: none; background: #1c212b; border: 1px solid #343b49; border-radius: 8px; padding: 8px 10px;
    font-family: Inter, system-ui, sans-serif; font-size: 13px; line-height: 1.35; max-width: 260px; opacity: 0; transition: opacity .1s; z-index: 5; }
  .tip b { font-weight: 600; } .tip .c { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="/">Connor Van Scyoc</a></div>
  <p class="status" id="status">Loading…</p>
  <svg id="cal" role="img" aria-label="Calendar of every therapy session since June 2022, one square per day"></svg>
  <p class="foot" id="foot"></p>
</div>
<div class="tip" id="tip"></div>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  let D;
  try { const r = await fetch("/api/therapy", { cache: "no-store" }); if (!r.ok) throw 0; D = await r.json(); }
  catch { $("status").textContent = "The calendar couldn't load just now. Try refreshing in a minute."; return; }
  $("status").hidden = true;

  const DAYS = D.days, START = D.start;
  const TODAY = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  const YEARS = []; for (let y = +START.slice(0, 4); y <= +TODAY.slice(0, 4); y++) YEARS.push(y);
  const C = { session: "#f2a23a", empty: "#252a34", before: "#171a20", ink: "#eceef2", muted: "#8c93a3", faint: "#5e6574" };
  const NS = "http://www.w3.org/2000/svg";
  const W = 1080, CELL = 14, STEP = 16, GX = 176, TOP = 210, BLOCK = 7 * STEP - 2, GAP = 34;
  const svg = $("cal");
  const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); (p || svg).appendChild(e); return e; };
  const txt = (s, a, p) => { const e = el("text", a, p); e.textContent = s; return e; };
  const iso = d => d.toISOString().slice(0, 10);
  const fmt = s => new Date(s + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  const short = s => new Date(s + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  const keys = Object.keys(DAYS).sort();
  const total = Object.values(DAYS).reduce((a, n) => a + n, 0);

  // header
  txt("Every therapy session", { x: GX - 2, y: 70, fill: C.ink, "font-size": 40, "font-weight": 700, "letter-spacing": "-0.5" });
  txt(total + " sessions since " + short(START), { x: GX - 2, y: 106, fill: C.muted, "font-size": 20 });
  let kx = GX - 2;
  [["Session", C.session], ["No session", C.empty]].forEach(([label, col]) => {
    el("rect", { x: kx, y: 136, width: 18, height: 18, rx: 3, fill: col });
    txt(label, { x: kx + 26, y: 151, fill: C.ink, "font-size": 19 });
    kx += 26 + label.length * 10.5 + 34;
  });

  // month initials over the grid
  const MON = "JFMAMJJASOND";
  for (let m = 0; m < 12; m++) {
    const d = new Date(Date.UTC(2023, m, 1)), j1 = new Date(Date.UTC(2023, 0, 1));
    const col = Math.floor(((d - j1) / 864e5 + j1.getUTCDay()) / 7);
    txt(MON[m], { x: GX + col * STEP + 2, y: TOP - 12, fill: C.faint, "font-size": 13, "font-weight": 500 });
  }

  YEARS.forEach((y, i) => {
    const y0 = TOP + i * (BLOCK + GAP);
    const j1 = new Date(Date.UTC(y, 0, 1)), off = j1.getUTCDay();
    let n = 0;
    for (let d = new Date(j1); d.getUTCFullYear() === y; d.setUTCDate(d.getUTCDate() + 1)) {
      const s = iso(d); if (s > TODAY) break;
      const doy = (d - j1) / 864e5, col = Math.floor((doy + off) / 7), row = d.getUTCDay();
      const hit = DAYS[s] || 0;
      n += hit;
      const r = el("rect", { x: GX + col * STEP, y: y0 + row * STEP, width: CELL, height: CELL, rx: 2.5, fill: hit ? C.session : (s < START ? C.before : C.empty) });
      r.dataset.d = s;
    }
    txt(String(y), { x: GX - 18, y: y0 + 52, "text-anchor": "end", fill: C.ink, "font-size": 30, "font-weight": 700 });
    txt(n + (n === 1 ? " session" : " sessions"), { x: GX - 18, y: y0 + 78, "text-anchor": "end", fill: C.muted, "font-size": 17 });
  });

  // longest break
  const ds = keys.map(k => new Date(k + "T00:00:00Z"));
  let best = [0];
  for (let i = 1; i < ds.length; i++) { const g = (ds[i] - ds[i - 1]) / 864e5; if (g > best[0]) best = [g, keys[i - 1], keys[i]]; }
  const yEnd = TOP + YEARS.length * (BLOCK + GAP) - GAP;
  if (best[1]) txt("Longest break: " + best[0] + " days, " + short(best[1]) + " to " + short(best[2]), { x: GX - 2, y: yEnd + 52, fill: C.muted, "font-size": 18 });
  svg.setAttribute("viewBox", "0 0 " + W + " " + (yEnd + 80));

  if (D.connected) $("foot").textContent = "New sessions show up on their own: the calendar checks my Venmo payments a few times a day.";

  // hover / tap
  const tip = $("tip");
  function show(e) {
    const r = e.target.closest && e.target.closest("rect[data-d]");
    if (!r) { tip.style.opacity = 0; return; }
    const s = r.dataset.d, hit = DAYS[s];
    tip.innerHTML = "<b>" + fmt(s) + "</b><br>" + (hit ? (hit > 1 ? hit + " sessions" : "Session") : '<span class="c">' + (s < START ? "Before therapy started" : "No session") + "</span>");
    tip.style.opacity = 1;
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", () => tip.style.opacity = 0);
})();
</script>
</body>
</html>
